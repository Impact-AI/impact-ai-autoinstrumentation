# OpenSSF Scorecard: the supply-chain checks of this repository, published to the Scorecard API and uploaded as SARIF to
# code scanning. Weekly, on a change of the branch protection, and on every push to main. Only in a public repository:
# the Scorecard API publishes public repositories only. The job holds the actions Scorecard allows when it publishes
# (no run steps), so it calls no make target.
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1"  # Mondays 05:23 UTC
  push:
    branches: [main]
permissions: {}
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read          # read the workflow runs
      security-events: write # upload the SARIF to code scanning
      id-token: write        # publish the results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
