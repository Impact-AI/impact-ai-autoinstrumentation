# Dependency review: a pull request that adds a dependency with a known vulnerability of moderate severity or above
# fails, unless it is one of the test fixtures' known vulnerabilities. The settings and that list are in
# .github/dependency-review-config.yml, so that they change without a change to this workflow. GitHub's dependency graph
# provides it in a public repository; a private one needs GitHub Code Security, so the job runs where the repository is
# public.
name: dependency-review
on:
  pull_request:
permissions: {}
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # the action reads its configuration file from the checked-out tree
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
