name: release
on:
  push:
    tags: ["v*"]
# Nothing is granted to the workflow as a whole; each job asks for what it needs, the one that publishes for signing.
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  reviewed:
    # A release is published only from a commit that was reviewed and merged: the tag has to be on main, where only a
    # merged pull request puts it (scripts/publish-public.sh).
    if: github.repository == 'Impact-AI/impact-ai-autoinstrumentation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: make release-reviewed
  e2e:
    needs: reviewed
    # The gate of a release: the end-to-end suite on the tagged commit, the kind shards on Kubernetes 1.34, 1.27 and
    # 1.37 and the container tests (ci.yml with release: true), before anything is published. CI runs the suite on main
    # once a day, not for each change; a release waits for it here. The cells of the Python qualification and the
    # overhead are make release's own. Only in the repository releases are made in: make release refuses to run anywhere
    # else.
    if: github.repository == 'Impact-AI/impact-ai-autoinstrumentation'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release: true
  publish:
    needs: e2e
    runs-on: ubuntu-latest
    # v0.2.1 took 3 minutes. The release now builds the Node.js image and measures the overhead of every runtime
    # (about ten minutes) before it pushes, then signs and verifies.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write      # push the images and the chart to ghcr.io
      id-token: write      # cosign signs keyless with this job's identity; GitHub's attestations need it too
      attestations: write  # the build provenance of the images and the chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # make release signs in with REGISTRY_TOKEN, verify-release with GH_TOKEN
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false  # a release installs its tools afresh: no cache another run could have written (zizmor)
      - name: Build, push, sign and package images and chart
        run: make release
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: The digests and names of what was pushed
        id: digests
        # make release writes build/release/<key>.digest and <key>.name: the names are under the publish root
        # (ghcr.io/impact-ai/autoinstrumentation-python, ... , ghcr.io/impact-ai/charts/impact-ai), in lowercase
        run: |
          for name in python nodejs reporter chart; do
            echo "$name=$(cat "build/release/$name.digest")" >> "$GITHUB_OUTPUT"
            echo "$name-name=$(cat "build/release/$name.name")" >> "$GITHUB_OUTPUT"
          done
      - name: Build provenance of the python image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.python-name }}
          subject-digest: ${{ steps.digests.outputs.python }}
          push-to-registry: true
          create-storage-record: false  # needs artifact-metadata: write, which signing does not
      - name: Build provenance of the nodejs image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.nodejs-name }}
          subject-digest: ${{ steps.digests.outputs.nodejs }}
          push-to-registry: true
          create-storage-record: false  # needs artifact-metadata: write, which signing does not
      - name: Build provenance of the reporter image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.reporter-name }}
          subject-digest: ${{ steps.digests.outputs.reporter }}
          push-to-registry: true
          create-storage-record: false  # needs artifact-metadata: write, which signing does not
      - name: Build provenance of the chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.chart-name }}
          subject-digest: ${{ steps.digests.outputs.chart }}
          push-to-registry: true
          create-storage-record: false  # needs artifact-metadata: write, which signing does not
      - name: Verify the release the way a customer does
        run: make verify-release
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
      - name: Keep what the GitHub release attaches
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/release/*.tgz
            build/release/*.spdx.json
            build/release/*.digest
            build/release/*.name
          if-no-files-found: error
          retention-days: 7
  github-release:
    # The release's page on GitHub: its notes from CHANGELOG.md and, as its files, the chart package, the bill of
    # materials of each image and platform, LICENSE and NOTICE, SHA256SUMS of them signed with cosign, and their build
    # provenance. A job of its own, so that only it may write the repository's contents, and only after everything was
    # pushed, signed and verified.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release and upload its files
      id-token: write      # cosign signs SHA256SUMS keyless with this job's identity; the attestation needs it too
      attestations: write  # the build provenance of the files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # gh reads GH_TOKEN
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build/release
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false  # a release installs its tools afresh: no cache another run could have written (zizmor)
      - name: The files, SHA256SUMS of them signed, and the notes
        run: make release-files
        env:
          VERSION: ${{ github.ref_name }}
      - name: The build provenance of the GitHub release's files
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: build/release/github/SHA256SUMS
          create-storage-record: false  # needs artifact-metadata: write, which signing does not
      - name: Publish the GitHub release from a draft
        run: make github-release
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
