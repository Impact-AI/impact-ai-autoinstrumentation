# SPDX-License-Identifier: Apache-2.0
name: Feature request
description: A runtime, library, platform or setting the kit does not support yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you need to do, and what stops you today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The behaviour you would like. A setting, a version, a platform.
  - type: input
    id: environment
    attributes:
      label: Your environment
      description: The versions that matter, for example Kubernetes distribution, Node.js or Python version, AI library.
