# Known vulnerabilities in the test fixtures of this directory that do not affect what the kit ships, for OSV-Scanner
# and OpenSSF Scorecard. These fixtures are workloads that run against mock providers in CI; nothing of them is in an
# image or the chart. Each entry says why it stays, and lapses after six months so that it is looked at again. The ids
# are GitHub's, which OSV-Scanner matches with their aliases (PYSEC, CVE), so that the dependency review of a pull
# request allows the same ones: .github/dependency-review-config.yml lists them (chart/tests/test_ci_supply_chain.py).

# requirements-oldest.txt pins the oldest LangGraph, LangChain and langchain-core the image traces, on purpose: their
# qualification cells prove those versions (python/qualification.json).
[[IgnoredVulns]]
