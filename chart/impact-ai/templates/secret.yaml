{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /* The Secret of a key the customer gives. With an install token the exchange hook makes the Secret, in the cluster. */ -}}
{{- if and .Values.ingest.key (not .Values.ingest.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-kit.keySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-kit.labels" . | nindent 4 }}
type: Opaque
stringData:
  ingest-key: {{ .Values.ingest.key | trim | quote }}
{{- end }}
