{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cluster-kit.reporterName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-kit.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Read-only, and never Secrets or ConfigMaps: the reporter sends names, not values.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cluster-kit.clusterRoleName" . }}
  labels:
    {{- include "cluster-kit.clusterLabels" . | nindent 4 }}
  annotations:
    impact.ai/product-id: {{ .Values.product.id | quote }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cluster-kit.clusterRoleName" . }}
  labels:
    {{- include "cluster-kit.clusterLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cluster-kit.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-kit.reporterName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-kit.reporterName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-kit.labels" . | nindent 4 }}
    {{- include "cluster-kit.selectorLabels" (dict "name" "reporter" "root" .) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cluster-kit.selectorLabels" (dict "name" "reporter" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cluster-kit.labels" . | nindent 8 }}
        {{- include "cluster-kit.selectorLabels" (dict "name" "reporter" "root" .) | nindent 8 }}
      annotations:
        # A new key restarts the reporter at once instead of when the kubelet refreshes the mounted Secret.
        checksum/key: {{ include "cluster-kit.keyChecksum" . | quote }}
    spec:
      serviceAccountName: {{ include "cluster-kit.reporterName" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- include "cluster-kit.pullSecrets" . | nindent 6 }}
      {{- include "cluster-kit.podPlacement" . | nindent 6 }}
      containers:
        - name: reporter
          image: {{ include "cluster-kit.image" (dict "name" "reporter" "root" .) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # Every argument is quoted as a whole: a value with a newline, a colon and a space, or a ' #' in it stays one
          # argument. A second --ingest-endpoint would win over the first and take the cluster's key to another host.
          args:
            - {{ printf "--ingest-endpoint=%s" (include "cluster-kit.ingestOrigin" .) | quote }}
            {{- if .Values.ingest.allowInsecureHttp }}
            - "--allow-insecure-ingest"
            {{- end }}
            - {{ printf "--interval=%s" .Values.reporter.interval | quote }}
            - {{ printf "--release-name=%s" .Release.Name | quote }}
            - {{ printf "--release-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--injection=%s" (ternary "enabled" "disabled" (not (empty (include "cluster-kit.operatorEnabled" .)))) | quote }}
            {{- if include "cluster-kit.coverFields" . }}
            - "--cover-fields"
            {{- end }}
            {{- with .Values.cluster.name }}
            - {{ printf "--cluster-name=%s" . | quote }}
            {{- end }}
            {{- with include "cluster-kit.cloudArgs" . }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            {{- with .Values.namespaces.include }}
            - {{ printf "--include-namespaces=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.namespaces.exclude }}
            - {{ printf "--exclude-namespaces=%s" (join "," .) | quote }}
            {{- end }}
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          resources:
            {{- toYaml .Values.reporter.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ingest-key
              mountPath: /var/run/secrets/impact
              readOnly: true
      volumes:
        - name: ingest-key
          secret:
            secretName: {{ include "cluster-kit.keySecretName" . }}
            items:
              - key: ingest-key
                path: ingest-key
