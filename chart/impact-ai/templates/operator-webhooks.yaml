{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- if include "cluster-kit.operatorEnabled" . }}
{{- /*
The Operator's webhooks and their certificate. Rendered here, not by the vendored chart, so that the namespace
selection comes from namespaces.include / namespaces.exclude, every webhook fails open, and no cert-manager is needed.
The certificate is made once (valid for ten years) and reused by every upgrade (cluster-kit.webhookCertificate), together
with the caBundle below: a new one on every upgrade left the webhook failing for the minute the kubelet needed to hand
the new Secret to the pod, and pods created meanwhile started uninjected.
*/ -}}
{{- $service := include "cluster-kit.operatorWebhookService" . }}
{{- $cert := include "cluster-kit.operatorCertificate" . | fromJson }}
{{- $selector := include "cluster-kit.namespaceSelector" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.operator.admissionWebhooks.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-kit.labels" . | nindent 4 }}
  annotations:
    # For which service the certificate was made: an upgrade reuses it only for the same one.
    impact.ai/service: {{ printf "%s.%s" $service .Release.Namespace | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ index $cert "tls.crt" }}
  tls.key: {{ index $cert "tls.key" }}
  ca.crt: {{ index $cert "ca.crt" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "cluster-kit.operatorName" . }}-mutation
  labels:
    {{- include "cluster-kit.clusterLabels" . | nindent 4 }}
webhooks:
  # Defaults the kit's Instrumentation resource (it lives in the release namespace, which the pod webhook skips).
  - name: minstrumentation.kb.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    clientConfig:
      caBundle: {{ index $cert "ca.crt" }}
      service:
        name: {{ $service }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-opentelemetry-io-v1alpha1-instrumentation
        port: 443
    rules:
      - apiGroups: [opentelemetry.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [instrumentations]
        scope: Namespaced
  # Injects the instrumentation into pods that carry instrumentation.opentelemetry.io/inject-python (or -nodejs).
  # Fails open: if the Operator is down or slow, pods start without it. System namespaces and this release's are skipped.
  # With the cover pod the annotation may arrive from another webhook (impact-ai-cover): the API server calls this one
  # again when a later webhook changed the pod, so the injection happens whichever of the two runs first.
  - name: mpod.kb.io
    admissionReviewVersions: [v1]
    sideEffects: None
    {{- if include "cluster-kit.coverEnabled" . }}
    reinvocationPolicy: IfNeeded
    {{- end }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    namespaceSelector:
      {{- $selector | nindent 6 }}
    clientConfig:
      caBundle: {{ index $cert "ca.crt" }}
      service:
        name: {{ $service }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-v1-pod
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "cluster-kit.operatorName" . }}-validation
  labels:
    {{- include "cluster-kit.clusterLabels" . | nindent 4 }}
webhooks:
  - name: vinstrumentationcreateupdate.kb.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    clientConfig:
      caBundle: {{ index $cert "ca.crt" }}
      service:
        name: {{ $service }}
        namespace: {{ .Release.Namespace }}
        path: /validate-opentelemetry-io-v1alpha1-instrumentation
        port: 443
    rules:
      - apiGroups: [opentelemetry.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [instrumentations]
        scope: Namespaced
{{- end }}
