# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: impact-ai
description: >-
  Impact AI auto-instrumentation for Kubernetes. Instruments the Python and Node.js workloads that call AI models, with
  no code change and no new image, and lists the cluster's workloads by name, never by value.
type: application
# make release replaces these with the release version
version: 0.0.0-dev
appVersion: 0.0.0-dev
kubeVersion: ">=1.27.0-0"
keywords: [opentelemetry, observability, ai, llm]
home: https://github.com/Impact-AI/impact-autoinstrumentation
icon: https://raw.githubusercontent.com/Impact-AI/impact-autoinstrumentation/main/docs/images/impact-ai.png
sources:
  - https://github.com/Impact-AI/impact-autoinstrumentation
maintainers:
  - name: Impact AI
    url: https://github.com/Impact-AI
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/Impact-AI/impact-autoinstrumentation/tree/main/docs
    - name: Support
      url: https://github.com/Impact-AI/impact-autoinstrumentation/blob/main/SUPPORT.md
    - name: Security policy
      url: https://github.com/Impact-AI/impact-autoinstrumentation/blob/main/SECURITY.md
dependencies:
  # Vendored, pinned and reduced by scripts/vendor_operator_chart.py. No repository: it lives in charts/.
  - name: opentelemetry-operator
    version: 0.128.0
    alias: operator
