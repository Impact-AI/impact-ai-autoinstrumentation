# SPDX-License-Identifier: Apache-2.0
# The outside parties of the end-to-end suite, in a namespace of their own:
#   mock    impact.ai's ingest (inventory and traces, behind the key) and the model providers
#   theirs  the customer's own backend (a collector, a Datadog agent)
apiVersion: v1
kind: Namespace
metadata:
  name: impact-mock
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock, namespace: impact-mock}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock}}
  template:
    metadata: {labels: {app: mock}}
    spec:
      containers:
        - name: mock
          image: localhost/impact-instrumentation/mock:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: mock, namespace: impact-mock}
spec: {selector: {app: mock}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: theirs, namespace: impact-mock}
spec:
  replicas: 1
  selector: {matchLabels: {app: theirs}}
  template:
    metadata: {labels: {app: theirs}}
    spec:
      containers:
        - name: mock
          image: localhost/impact-instrumentation/mock:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: theirs, namespace: impact-mock}
spec: {selector: {app: theirs}, ports: [{port: 8080, targetPort: 8080}]}
