# SPDX-License-Identifier: Apache-2.0

[project]
name = "impact-instrumentation"
version = "0.1.0"
description = "impact.ai Python auto-instrumentation image: sources and test environment (the image payload is assembled by tools/assemble_payload.py)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-xdist==3.8.0",  # the container tests run in parallel
  "ruff==0.15.12",
  # The SDK and instrumentation base the payload is built on; the unit tests run the real code.
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-instrumentation==0.66b2",
  "opentelemetry-util-http==0.66b2",
  # Test-only references: the official OTLP encoder is the oracle for our JSON encoder.
  "opentelemetry-exporter-otlp-proto-common==1.45.2",
  "opentelemetry-proto==1.45.2",
  # The chart render checks (chart/tests) read the manifests helm template produces.
  "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests/unit"]
addopts = "-ra"
markers = [
  "image: runs containers (make test-image)",
  "tracers: needs the fixtures that carry Datadog or Traceloop (run by make e2e)",
  "agents: needs the agent framework fixtures, which are large (make test-agents, and make e2e)",
  "nodejs: runs the Node.js image and its fixture workloads in containers (make test-nodejs, make test-nodejs-matrix)",
  "matrix: one cell of the Node.js qualification matrix (make test-nodejs-matrix, make qualify, and make e2e)",
  "gateways: runs LiteLLM and Portkey images against the mock (make e2e)",
  "overhead: measures an injected workload against the same one without injection (make overhead)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["impact_instrumentation", "helpers", "containers", "conftest", "kube", "assemble_payload", "gate", "combos", "harness", "nodejs_support"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Long lines are the template text the script writes into the vendored chart.
"**/vendor_operator_chart.py" = ["E501"]
